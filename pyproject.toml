[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost"
version = "0.1.0"
description = "Ghost-defense heliocentricity model for Big Data Bowl tracking data"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "torch"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ghost = "ghost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
